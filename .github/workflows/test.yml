name: NPM Test
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main

      - run: nix develop -c npm i
      - run: nix develop -c npm run test
        env:
          PUBLIC_WALLETCONNECT_ID: ${{ secrets.PUBLIC_WALLETCONNECT_ID }}
          PUBLIC_ALPHAVANTAGE_API_KEY: ${{ secrets.PUBLIC_ALPHAVANTAGE_API_KEY }}
          PRIVATE_PINATA_JWT: ${{ secrets.PRIVATE_PINATA_JWT }}
          PUBLIC_PINATA_GATEWAY_URL: ${{ secrets.PUBLIC_PINATA_GATEWAY_URL }}
          PRIVATE_PINATA_GATEWAY_KEY: ${{ secrets.PRIVATE_PINATA_GATEWAY_KEY }}

              
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main
      - run: nix develop -c npm ci
      - run: nix develop -c npm run svelte-lint-format-check
        env:
          PUBLIC_WALLETCONNECT_ID: ${{ secrets.PUBLIC_WALLETCONNECT_ID }}
          PUBLIC_ALPHAVANTAGE_API_KEY: ${{ secrets.PUBLIC_ALPHAVANTAGE_API_KEY }}
          PRIVATE_PINATA_JWT: ${{ secrets.PRIVATE_PINATA_JWT }}
          PUBLIC_PINATA_GATEWAY_URL: ${{ secrets.PUBLIC_PINATA_GATEWAY_URL }}
          PRIVATE_PINATA_GATEWAY_KEY: ${{ secrets.PRIVATE_PINATA_GATEWAY_KEY }}
