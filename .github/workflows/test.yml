name: NPM Test
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main

      - run: nix develop -c npm i
      - run: nix develop -c npm run test
        env:
          PUBLIC_WALLETCONNECT_ID: ${{ secrets.PUBLIC_WALLETCONNECT_ID }}
          PUBLIC_ALPHAVANTAGE_API_KEY: ${{ secrets.PUBLIC_ALPHAVANTAGE_API_KEY }}
          PRIVATE_PINATA_JWT: ${{ secrets.PRIVATE_PINATA_JWT }}
          PUBLIC_PINATA_GATEWAY_URL: ${{ secrets.PUBLIC_PINATA_GATEWAY_URL }}
          PRIVATE_PINATA_GATEWAY_KEY: ${{ secrets.PRIVATE_PINATA_GATEWAY_KEY }}

              
  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main

      - name: Cache Foundry installation
        uses: actions/cache@v4
        with:
          path: ~/.foundry
          # Rotate by bumping the v1 suffix when foundryup major changes
          # (per RESEARCH Pitfall 3).
          key: foundry-${{ runner.os }}-v1
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Install Foundry (anvil)
        run: |
          if [ ! -x "$HOME/.foundry/bin/anvil" ]; then
            curl -L https://foundry.paradigm.xyz | bash
            "$HOME/.foundry/bin/foundryup"
          fi
          echo "$HOME/.foundry/bin" >> $GITHUB_PATH

      - name: Verify anvil
        run: anvil --version

      - run: nix develop -c npm i

      - name: Run integration tests
        run: nix develop -c npm run test:integration
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          PUBLIC_WALLETCONNECT_ID: ${{ secrets.PUBLIC_WALLETCONNECT_ID }}
          PUBLIC_ALPHAVANTAGE_API_KEY: ${{ secrets.PUBLIC_ALPHAVANTAGE_API_KEY }}
          PRIVATE_PINATA_JWT: ${{ secrets.PRIVATE_PINATA_JWT }}
          PUBLIC_PINATA_GATEWAY_URL: ${{ secrets.PUBLIC_PINATA_GATEWAY_URL }}
          PRIVATE_PINATA_GATEWAY_KEY: ${{ secrets.PRIVATE_PINATA_GATEWAY_KEY }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main
      - run: nix develop -c npm i
      - run: nix develop -c npm run svelte-lint-format-check
        env:
          PUBLIC_WALLETCONNECT_ID: ${{ secrets.PUBLIC_WALLETCONNECT_ID }}
          PUBLIC_ALPHAVANTAGE_API_KEY: ${{ secrets.PUBLIC_ALPHAVANTAGE_API_KEY }}
          PRIVATE_PINATA_JWT: ${{ secrets.PRIVATE_PINATA_JWT }}
          PUBLIC_PINATA_GATEWAY_URL: ${{ secrets.PUBLIC_PINATA_GATEWAY_URL }}
          PRIVATE_PINATA_GATEWAY_KEY: ${{ secrets.PRIVATE_PINATA_GATEWAY_KEY }}
