name: NPM Test
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main

      - run: nix develop -c npm i
      - run: nix develop -c npm run test
        env:
          PUBLIC_WALLETCONNECT_ID: ${{ secrets.PUBLIC_WALLETCONNECT_ID }}
          PUBLIC_ALPHAVANTAGE_API_KEY: ${{ secrets.PUBLIC_ALPHAVANTAGE_API_KEY }}
          PRIVATE_PINATA_JWT: ${{ secrets.PRIVATE_PINATA_JWT }}
          PUBLIC_PINATA_GATEWAY_URL: ${{ secrets.PUBLIC_PINATA_GATEWAY_URL }}
          PRIVATE_PINATA_GATEWAY_KEY: ${{ secrets.PRIVATE_PINATA_GATEWAY_KEY }}

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main

      - run: nix develop -c npm i

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: nix develop -c npx playwright install --with-deps chromium

      - name: Compliance smoke pre-flight
        run: nix develop -c npx playwright test compliance.spec.ts --project=chromium

      - name: E2E full suite
        run: nix develop -c npm run test:e2e
        env:
          PUBLIC_WALLETCONNECT_ID: ${{ secrets.PUBLIC_WALLETCONNECT_ID }}
          PUBLIC_ALPHAVANTAGE_API_KEY: ${{ secrets.PUBLIC_ALPHAVANTAGE_API_KEY }}
          PRIVATE_PINATA_JWT: ${{ secrets.PRIVATE_PINATA_JWT }}
          PUBLIC_PINATA_GATEWAY_URL: ${{ secrets.PUBLIC_PINATA_GATEWAY_URL }}
          PRIVATE_PINATA_GATEWAY_KEY: ${{ secrets.PRIVATE_PINATA_GATEWAY_KEY }}
          ST0X_API_URL: ${{ secrets.ST0X_API_URL }}
          ST0X_API_KEY: ${{ secrets.ST0X_API_KEY }}
          ST0X_API_SECRET: ${{ secrets.ST0X_API_SECRET }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main
      - run: nix develop -c npm i
      - run: nix develop -c npm run svelte-lint-format-check
        env:
          PUBLIC_WALLETCONNECT_ID: ${{ secrets.PUBLIC_WALLETCONNECT_ID }}
          PUBLIC_ALPHAVANTAGE_API_KEY: ${{ secrets.PUBLIC_ALPHAVANTAGE_API_KEY }}
          PRIVATE_PINATA_JWT: ${{ secrets.PRIVATE_PINATA_JWT }}
          PUBLIC_PINATA_GATEWAY_URL: ${{ secrets.PUBLIC_PINATA_GATEWAY_URL }}
          PRIVATE_PINATA_GATEWAY_KEY: ${{ secrets.PRIVATE_PINATA_GATEWAY_KEY }}
