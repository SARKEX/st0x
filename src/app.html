<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!--
			Load fonts without blocking first paint: `media="print"` makes the
			stylesheet non-render-blocking, then `onload` swaps it to `all` once
			fetched. `display=swap` (in each URL) shows fallback text meanwhile.
			<noscript> keeps fonts working with JS disabled.
		-->
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media='all'"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Handjet:wght@100..900&family=Instrument+Serif:ital@0;1&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media='all'"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;700&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media='all'"
		/>
		<noscript>
			<link
				href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
				rel="stylesheet"
			/>
			<link
				href="https://fonts.googleapis.com/css2?family=Handjet:wght@100..900&family=Instrument+Serif:ital@0;1&display=swap"
				rel="stylesheet"
			/>
			<link
				href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;700&display=swap"
				rel="stylesheet"
			/>
		</noscript>

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
