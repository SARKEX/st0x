<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>st0x · Save &amp; Earn — v2</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // mint-emerald signature scale (anchor 400 = #2de3a6). Yellow is RETIRED →
    // we remap the entire `yellow` palette onto mint so legacy yellow CTAs
    // become the new green signature automatically.
    const mint = {
      50:'#e9fdf6', 100:'#c8fae9', 200:'#9bf3d6', 300:'#62ecc1',
      400:'#2de3a6', 500:'#16c78c', 600:'#10a877', 700:'#0e8a62',
      800:'#0f6e50', 900:'#0e5a43', 950:'#053124',
    };
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Space Grotesk', 'DM Sans', 'system-ui', 'sans-serif'],
            sans: ['DM Sans', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            emerald: mint,
            yellow: mint,
            iris: { 300:'#a7b1ff', 400:'#8f9bff', 500:'#7d8bff', 600:'#5b66e0' },
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --bg:#070b11; --bg-deep:#04070c;
      --surface-1:#0c121b; --surface-2:#111a25; --surface-3:#18222f;
      --line:rgba(255,255,255,0.07); --line-strong:rgba(255,255,255,0.12);
      --accent:#2de3a6; --accent-deep:#15c78c; --iris:#7d8bff;
      --font-display:'Space Grotesk','DM Sans',system-ui,sans-serif;
      --font-mono:'JetBrains Mono',ui-monospace,monospace;
    }
    html { scroll-behavior: smooth; }
    body {
      margin:0; font-family:'DM Sans', system-ui, sans-serif;
      background:#070b11; color:#eef3f8; -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    /* Display font on real headings — the design-language signature */
    h1, h2, h3, h4, .font-display { font-family: var(--font-display); letter-spacing:-0.02em; }
    .font-mono { font-family: var(--font-mono); font-feature-settings:"tnum" 1, "zero" 1; }
    ::selection { background: rgba(45,227,166,0.20); color:#eef3f8; }

    /* ambient layer (behind the app) */
    #amb2 { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    #amb2-canvas { position:absolute; inset:0; }
    #amb2 .aura {
      position:absolute; border-radius:50%; filter: blur(80px); opacity:.85; will-change: transform;
    }
    #amb2 .grid-veil {
      position:absolute; inset:-2px;
      background-image:
        linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
      background-size:64px 64px;
      -webkit-mask-image: radial-gradient(130% 100% at 50% 0%, #000 35%, transparent 82%);
              mask-image: radial-gradient(130% 100% at 50% 0%, #000 35%, transparent 82%);
    }
    @keyframes auraDrift1 { 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(6vw,5vh) scale(1.14); } }
    @keyframes auraDrift2 { 0%,100%{ transform:translate(0,0) scale(1.05); } 50%{ transform:translate(-5vw,4vh) scale(0.92); } }
    @keyframes auraDrift3 { 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(4vw,-5vh) scale(1.1); } }

    /* slow drifting glow inside the product frame */
    @keyframes glowFloat1 { 0%,100%{ transform:translate(-50%,0) scale(1); } 50%{ transform:translate(-42%,6%) scale(1.12); } }
    @keyframes glowFloat2 { 0%,100%{ transform:translate(50%,0) scale(1.05); } 50%{ transform:translate(44%,-7%) scale(0.94); } }

    .font-mono { font-variant-numeric: tabular-nums; }
    /* range slider (mint) */
    input[type=range] { -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; background:rgba(255,255,255,0.08); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; height:18px; width:18px; border-radius:50%; background:#2de3a6; cursor:pointer; border:3px solid #042b1f; box-shadow:0 0 0 1px rgba(45,227,166,.5); }
    input[type=range]::-moz-range-thumb { height:18px; width:18px; border-radius:50%; background:#2de3a6; cursor:pointer; border:3px solid #042b1f; }
    /* live-price chart scroll */
    @keyframes chartscroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes tickertape { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    /* scrollbars */
    .overflow-y-auto::-webkit-scrollbar, .overflow-x-auto::-webkit-scrollbar { width:9px; height:9px; }
    .overflow-y-auto::-webkit-scrollbar-thumb, .overflow-x-auto::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:999px; }
    .overflow-y-auto::-webkit-scrollbar-track, .overflow-x-auto::-webkit-scrollbar-track { background:transparent; }
    .no-bar::-webkit-scrollbar { display:none; }
    .no-bar { scrollbar-width:none; }

    @media (prefers-reduced-motion: reduce) {
      #amb2 .aura, [class*="animate-"] { animation: none !important; }
      .chart-scroll { animation: none !important; }
    }
  </style>

  <!-- Bundler thumbnail (splash + no-JS fallback) -->
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#070b11"/>
      <g transform="translate(50 47)">
        <circle r="21" fill="none" stroke="#2de3a6" stroke-width="3.5"/>
        <circle r="3.4" fill="#2de3a6"/>
      </g>
      <text x="50" y="86" text-anchor="middle" fill="#2de3a6" font-family="monospace" font-size="10" font-weight="700">EARN 3.53%</text>
    </svg>
  </template>
</head>
<body>
  <!-- ambient motion: slow aurora + bokeh field (no wave-lines) -->
  <div id="amb2" aria-hidden="true">
    <canvas id="amb2-canvas"></canvas>
    <div class="aura" style="width:620px;height:560px;left:6%;top:-14%;background:radial-gradient(circle at 50% 50%, rgba(45,227,166,0.16), transparent 70%);animation:auraDrift1 54s ease-in-out infinite;"></div>
    <div class="aura" style="width:540px;height:520px;left:64%;top:2%;background:radial-gradient(circle at 50% 50%, rgba(125,139,255,0.12), transparent 70%);animation:auraDrift2 66s ease-in-out infinite;"></div>
    <div class="aura" style="width:720px;height:660px;left:28%;top:42%;background:radial-gradient(circle at 50% 50%, rgba(45,227,166,0.06), transparent 70%);animation:auraDrift3 78s ease-in-out infinite;"></div>
    <div class="grid-veil"></div>
  </div>

  <div id="root" style="position:relative; z-index:1;"></div>

  <script src="src2/ambient2.js"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src2/data.jsx"></script>
  <script type="text/babel" src="src2/atoms.jsx"></script>
  <script type="text/babel" src="src2/AppShell.jsx"></script>
  <script type="text/babel" src="src2/Home.jsx"></script>
  <script type="text/babel" src="src2/HomeMarketing.jsx"></script>
  <script type="text/babel" src="src2/EarnParts.jsx"></script>
  <script type="text/babel" src="src2/Earn.jsx"></script>
  <script type="text/babel" src="src2/Dashboard.jsx"></script>
  <script type="text/babel" src="src2/Metrics.jsx"></script>
  <script type="text/babel" src="src2/TradeCharts.jsx"></script>
  <script type="text/babel" src="src2/Trade.jsx"></script>
  <script type="text/babel" src="src2/DepositModal.jsx"></script>
  <script type="text/babel" src="src2/Strategy.jsx"></script>
  <script type="text/babel" src="src2/App.jsx"></script>
</body>
</html>
