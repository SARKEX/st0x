<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'system-ui', 'sans-serif'],
            mono: ['Roboto Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            primary: '#4c77ba',
          },
        },
      },
    };
  </script>

  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', system-ui, sans-serif; background: #04070d; color: #fff; -webkit-font-smoothing: antialiased; }
    .font-mono { font-family: 'Roboto Mono', monospace; }
    /* Custom range slider thumb (emerald) */
    input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #34d399; cursor: pointer; border: 3px solid #04241a; box-shadow: 0 0 0 1px rgba(52,211,153,.5); }
    input[type=range]::-moz-range-thumb { height: 18px; width: 18px; border-radius: 50%; background: #34d399; cursor: pointer; border: 3px solid #04241a; }
    /* Ambient live-price chart scroll (swap card) */
    @keyframes chartscroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) { .chart-scroll { animation: none !important; } }
    /* Scrollbar inside the product frame */
    .overflow-y-auto::-webkit-scrollbar { width: 9px; }
    .overflow-y-auto::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 999px; }
    .overflow-y-auto::-webkit-scrollbar-track { background: transparent; }
  </style>

  <!-- Bundler thumbnail (splash + no-JS fallback) -->
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#04070d"/>
      <g transform="translate(50 50)">
        <circle r="22" fill="none" stroke="#34d399" stroke-width="3"/>
        <path d="M-9 4 L-3 -4 L3 1 L10 -8" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="50" y="88" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="9" font-weight="700">EARN 3.53%</text>
    </svg>
  </template>
</head>
